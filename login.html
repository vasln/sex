<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
</head>
<body>
    <!-- Шапка -->
     <header class="header">
        <a class="header__logo" href="/" >Конференции.РФ</a>
        <nav class="nav">
            <a class="nav__link" href="login.html">Login</a>
            <a class="nav__link" href="register.html">Register</a>
        </nav>
    </header>
    <main>
        <h1>Вход в систему</h1>
        <div class="message"></div>
        <form method="post" action="/login" class="form-box" novalidate id="loginForm">
            <label for="login">Логин</label>
            <input class="form-control" id="login" name="login" type="text">

            <label for="password">Пароль</label>
            <input class="form-control" id="password" name="password" type="password">

            <button class="btn btn-primary">Войти</button>
        </form>
        <div class="form__error">Пример ошибки</div>
        <p>Ещё не зарегестрированы? <a href="/register">Регистрация</a></p>
    </main>
    <footer>«© 2027 Конференции.РФ».</footer>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
