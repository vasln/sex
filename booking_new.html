<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <a class="header__logo" href="/" >Конференции.РФ</a>
        <nav class="nav">
            <a class="nav__link" href="login.html">Login</a>
            <a class="nav__link" href="register.html">Register</a>
        </nav>
    </header>
    <main class="main">
        <div class="message"></div>
        <form method="post" action="/login">
            <label for="room_name">Помещение</label>
            <input id="room_name" name="room_name" type="text" placeholder="Кинозал «Премьер»">
            <div class="form__error"></div>

            <label for="start_date">Дата начала концеренции</label>
            <input id="start_date" name="start_date" type="date" placeholder="ДД.ММ.ГГГГ">

            <label for="start_date">Способ оплаты</label>
            <!-- Переключатели (radio): выбрать можно только один вариант -->
            <input type="radio" id="pay1" name="payment_method" value="При очном посещении">
            <label for="pay1">При очном посещении</label>
            <input type="radio" id="pay2" name="payment_method" value="Перевод по СБП">
            <label for="pay2">Перевод по СБП</label>

            <button>Отправить</button>
        </form>
        <p>Уже зарегестрированы? <a href="/login">Вход</a></p>
    </main>
        <!-- Подвал -->
    <footer>«© 2027 Конференции.РФ».</footer>
</body>
</html>
