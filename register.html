<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <a class="header__logo" href="/" >Конференции.РФ</a>
        <nav class="nav">
            <a class="nav__link" href="login.html">Login</a>
            <a class="nav__link" href="register.html">Register</a>
        </nav>
    </header>
    <main>
        <div class="message"></div>
        <form id="registerForm" novalidate class="form-box">
            <label for="login">Логин</label>
            <input id="login" name="login" type="text" placeholder="ivanov2027">
            <div class="form__error"></div>
            
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password">
            <div class="form__error"></div>

            <label for="full_name">ФИО</label>
            <input id="full_name" name="full_name" type="text" placeholder="Иван Иванович Виванович">
            <div class="form__error"></div>

            <label for="phone">Телефон</label>
            <input id="phone" name="phone" type="tel" placeholder="8(900)123-45-67">
            <div class="form__error"></div>
            
            <label for="email">Почта</label>
            <input id="email" name="email" type="email" placeholder="name@example.ru">
            <div class="form__error"></div>

            <button class="btn btn-primary">Создать пользователя</button>
        </form>
        <p>Уже зарегестрированы? <a href="/login">Вход</a></p>
    </main>
    <!-- Подвал -->
    <footer>«© 2027 Конференции.РФ».</footer>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
